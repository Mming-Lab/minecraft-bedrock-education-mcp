name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    name: server (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest release still supported; 24 is the current LTS.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        working-directory: packages/server
        run: npm ci

      - name: Build
        working-directory: packages/server
        run: npm run build

      # Checks the tool definitions directly: names, output schemas, whether each
      # description says when not to use the tool, whether cross-references resolve.
      - name: Tool surface
        working-directory: packages/server
        run: node test/tools.test.mjs

      # Pins the generated command strings row by row, and - the part worth having - the
      # inputs that must be refused before they reach the socket: `air 0 destroy`, a
      # `hollow` setblock, a fill past the volume limit.
      - name: Command strings
        working-directory: packages/server
        run: node test/commands.test.mjs

      # The corpus is regenerated by the step above. A change in what the builders emit is a
      # diff here, not just a green test in a file nobody opened.
      - name: Command corpus unchanged
        run: |
          if ! git diff --quiet -- tests/golden/commands; then
            echo "The generated commands changed. Commit the regenerated corpus if that was intended."
            git diff -- tests/golden/commands
            exit 1
          fi

      # The packing contract - every block asked for, no block that was not. Checked against
      # random sets as well as shapes, because the legacy packer passed 78 measured cases and
      # broke on the first input whose projection had a hole in it.
      - name: Block packing
        working-directory: packages/server
        run: node test/optimize.test.mjs
        env:
          PROPERTY_RUNS: 500

      # Decodes real records captured from a running Education Edition world - four
      # subchunks at four bit widths and three saved structures. No game, no database, no
      # network: the formats are pure functions over bytes, so they belong here.
      - name: World records
        working-directory: packages/server
        run: node test/world.test.mjs

      # The add-on protocol: correlating replies that arrive as chat, and refusing an answer
      # that lost a line. A dropped line is invisible - the survivors are all well formed -
      # so without the header count a partial region would be handed over as a complete one.
      - name: Bridge protocol
        working-directory: packages/server
        run: node test/bridge.test.mjs
      # Searches the parameter space for inputs that break an invariant, rather than checking
      # the handful a fixed case happens to cover. It found a helix that came out in two
      # pieces at a radius no golden case used.
      - name: Geometry properties
        working-directory: packages/server
        run: node test/geometry.property.test.mjs
        env:
          PROPERTY_RUNS: 500

      # Spawns the built server and drives it with a real MCP client. A schema the SDK
      # rejects or a result that fails output validation passes the steps above and fails
      # here, which is the point of running all three.
      - name: Server over stdio
        working-directory: packages/server
        run: node test/server.test.mjs

  goldens:
    name: geometry goldens
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the extractor
        working-directory: tools/golden-extract
        run: npm ci

      - name: Install the server
        working-directory: packages/server
        run: npm ci

      - name: Build the server
        working-directory: packages/server
        run: npm run build

      # Recompiles the legacy sources and regenerates the goldens. build.mjs fails if tsc
      # reports anything but the three known errors, so a change to the legacy code cannot
      # silently shift the baseline the rewrite is measured against.
      - name: Regenerate the goldens
        working-directory: tools/golden-extract
        run: npm run extract

      - name: Goldens unchanged
        run: |
          if ! git diff --quiet -- tests/golden; then
            echo "Regenerating the goldens changed them. The legacy sources or the case"
            echo "matrix moved; commit the regenerated files if that was intended."
            git diff --stat -- tests/golden
            exit 1
          fi

      # The gate on the gate: running the suite against the legacy implementation must fail,
      # on exactly the cases whose verdict says the rewrite has to diverge. It also refuses
      # any case whose recorded output violates an invariant but is marked `equivalent` -
      # that is how a defect gets written down as correct behaviour.
      - name: Golden suite self-test
        working-directory: tools/golden-extract
        run: npm run selftest

      - name: Rewrite against the goldens
        working-directory: packages/server
        run: npm run test:golden

  audit:
    name: legacy tool surface
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: tools/golden-extract
        run: npm ci

      # Reads the legacy tool schemas from the syntax tree - the classes cannot be imported,
      # since BaseTool depends on socket-be. Records where the descriptions and the code
      # disagree; informational while the rewrite is in progress.
      - name: Audit
        working-directory: tools/golden-extract
        run: npm run audit

      - name: Audit report unchanged
        run: |
          if ! git diff --quiet -- tests/golden/schemas; then
            echo "The legacy tool surface changed. Commit the regenerated report."
            git diff --stat -- tests/golden/schemas
            exit 1
          fi
