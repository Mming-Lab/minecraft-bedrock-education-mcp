name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    name: server (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest release still supported; 24 is the current LTS.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Checks the tool definitions directly: names, output schemas, whether each
      # description says when not to use the tool, whether cross-references resolve.
      - name: Tool surface
        run: node test/tools.test.mjs

      # Pins the generated command strings row by row, and - the part worth having - the
      # inputs that must be refused before they reach the socket: `air 0 destroy`, a
      # `hollow` setblock, a fill past the volume limit.
      - name: Command strings
        run: node test/commands.test.mjs

      # The corpus is regenerated by the step above. A change in what the builders emit is a
      # diff here, not just a green test in a file nobody opened.
      - name: Command corpus unchanged
        run: |
          if ! git diff --quiet -- test/fixtures; then
            echo "The generated commands changed. Commit the regenerated corpus if that was intended."
            git diff -- test/fixtures
            exit 1
          fi

      # The packing contract - every block asked for, no block that was not. Checked against
      # random sets as well as shapes, because the legacy packer passed 78 measured cases and
      # broke on the first input whose projection had a hole in it.
      - name: Block packing
        run: node test/optimize.test.mjs
        env:
          PROPERTY_RUNS: 500

      # Turning a packed shape into commands and sending them. Mostly about failure: a
      # negative status code is not a refusal, a command that never left is, and everything
      # failing to leave is a missing connection rather than a half-built shape.
      - name: Placing blocks
        run: node test/placer.test.mjs

      # The layer grid as an input. The pair of reserved characters carries the weight - "."
      # clears a block and "?" must never reach a command - and the last case hands
      # read_region's own output straight to build.layers, since the round trip stops working
      # the moment the two notations drift.
      - name: Building from layers
        run: node test/build-layers.test.mjs

      # Decodes real records captured from a running Education Edition world - four
      # subchunks at four bit widths and three saved structures. No game, no database, no
      # network: the formats are pure functions over bytes, so they belong here.
      - name: World records
        run: node test/world.test.mjs

      # Reading the world: the layer encoding, and what the tools do with a bad reply. A read
      # that comes back short and is accepted is the one outcome the whole path exists to
      # prevent, so the retry and the refusal are checked rather than the happy case.
      - name: World tools
        run: node test/world-tools.test.mjs

      # The add-on protocol: correlating replies that arrive as chat, and refusing an answer
      # that lost a line. A dropped line is invisible - the survivors are all well formed -
      # so without the header count a partial region would be handed over as a complete one.
      - name: Bridge protocol
        run: node test/bridge.test.mjs

      # The socket, against a fake Bedrock client. The first case asserts on the subscribe
      # frame itself: socket-be decides its subscriptions from the handlers registered when a
      # connection lands, so registering PlayerMessage a moment late means chat never arrives
      # and nothing says so. That cost a live session.
      - name: Transport
        run: node test/transport.test.mjs
      # Searches the parameter space for inputs that break an invariant, rather than checking
      # the handful a fixed case happens to cover. It found a helix that came out in two
      # pieces at a radius no golden case used.
      - name: Geometry properties
        run: node test/geometry.property.test.mjs
        env:
          PROPERTY_RUNS: 500

      # Spawns the built server and drives it with a real MCP client. A schema the SDK
      # rejects or a result that fails output validation passes the steps above and fails
      # here, which is the point of running all three.
      - name: Server over stdio
        run: node test/server.test.mjs

      # The rewrite against the recorded legacy output. The goldens are frozen: the extractor
      # that produced them ran the legacy implementation, and that implementation is gone as of
      # legacy/v1.0.0. Freezing is the point - this measures the rewrite against what was
      # actually observed, not against something regenerated alongside it.
      - name: Geometry goldens
        run: npm run test:golden

      # The half of the old self-test that never needed the legacy build, and the half its own
      # README called the important one. A case whose recorded output contains a known defect
      # must not be marked `equivalent`, because `equivalent` instructs the rewrite to
      # reproduce it. Comparing verdicts against a validator that reads the same verdicts would
      # pass when both moved together; this reads the measured output instead.
      - name: Goldens do not record defects as correct
        run: node test/golden-integrity.test.mjs
